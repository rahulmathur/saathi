<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saathi Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{
  --navy:#1C2B4F; --ink:#1A1D24; --muted:#5A6172; --ground:#F5F6F8; --card:#FFFFFF; --line:#E3E5EA;
  --marigold:#F4A62A; --marigold-soft:#FDF0D9; --brown:#7A4A00; --teal:#0E6E66; --teal-soft:#E3F2EF;
  --red:#B42318; --page:#E9EBF0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);font-family:'Atkinson Hyperlegible','Noto Sans Devanagari',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
a{color:var(--navy)}
.wrap{min-height:100vh;display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:28px 16px;flex-wrap:wrap}
.side{max-width:280px;display:flex;flex-direction:column;gap:10px}
.side h1{margin:0;font-size:28px;color:var(--navy)}
.side p{margin:0;color:var(--muted);line-height:1.45}
.side .group{font-size:13px;font-weight:700;color:var(--muted);margin-top:10px;text-transform:uppercase;letter-spacing:.06em}
.side .jump{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px}
.side .jump.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.phone{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 56px);min-height:640px;border-radius:40px;background:var(--ground);box-shadow:0 0 0 10px #11151F,0 30px 60px rgba(17,21,31,.25);overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone.white{background:#fff}
.scroll{flex:1;overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.label{font-size:15px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.gold{background:var(--marigold-soft);color:var(--brown)}
.chip.grey{background:#F0F1F4;color:#3E4553}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:16px;border:0;font-size:17px;font-weight:700;text-decoration:none;padding:0 16px}
.btn.primary{background:var(--navy);color:#fff}
.btn.gold{background:var(--marigold);color:var(--navy)}
.btn.outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ok{background:var(--teal-soft);color:var(--teal)}
.back{width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);flex-shrink:0}
h2.title{margin:0;font-size:26px}
.pill{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:15px;white-space:nowrap;flex-shrink:0}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field span:first-child{display:block;font-size:13px;color:var(--muted)}
.field span:last-child{display:block;font-size:17px;font-weight:700}
.switch{display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:4px 0;text-align:left;color:var(--ink);width:100%}
.track{width:52px;height:32px;border-radius:16px;background:#C9CDD6;position:relative;flex-shrink:0;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.switch[aria-checked="true"] .track{background:var(--teal)}
.switch[aria-checked="true"] .track::after{left:23px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--navy);font-size:15px;font-weight:700}
.tile.on{background:var(--marigold-soft);border-color:var(--marigold)}
nav.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding:8px 8px 18px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:transparent;border:0;color:var(--muted);font-size:13px}
nav.tabs button.on{color:var(--navy);font-weight:700}
.seg{display:flex;background:#F0F1F4;border-radius:999px;padding:4px}
.seg button{height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--ink);font-size:16px}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.big{min-height:68px;border-radius:20px;font-size:21px}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.bars span{height:8px;border-radius:4px;background:var(--line);display:block}
.bars span.done{background:var(--teal)} .bars span.now{background:var(--marigold)}
.tl{display:flex;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:20px}
.tl .dot{width:14px;height:14px;border-radius:7px;margin-top:4px;background:var(--teal)}
.tl .dot.now{width:18px;height:18px;border-radius:9px;margin-top:2px;background:var(--marigold);border:3px solid var(--marigold-soft)}
.tl .dot.next{background:#fff;border:2px solid #9AA1AF}
.tl .line{flex:1;width:2px;background:var(--line);min-height:22px}
.xl .sz-h1{font-size:39px!important}.xl .sz-h2{font-size:30px!important}.xl .sz-body{font-size:24px!important}.xl .sz-btn{font-size:24px!important}.xl .sz-label{font-size:20px!important}
@media (max-width:760px){.side{max-width:390px;width:100%}.phone{height:calc(100vh - 40px);border-radius:28px}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="row"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="13" cy="17" r="10" fill="#1C2B4F"/><circle cx="21" cy="17" r="10" fill="#F4A62A" fill-opacity=".92"/></svg><h1>Saathi</h1></div>
    <p>Clickable prototype: no parent flies alone. Tap through the phone, or jump to a screen.</p>
    <div class="group">Family app</div>
    <div id="jumpsFamily"></div>
    <div class="group">Parent app</div>
    <div id="jumpsParent"></div>
    <div class="group">Parent text size</div>
    <div class="seg" role="group" aria-label="Text size"><button id="szL" class="on">Large</button><button id="szXL">Extra large</button></div>
  </aside>
  <main id="phone" class="phone" aria-live="polite"></main>
</div>

<script>
const I = {
  plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
  back:'<polyline points="15 18 9 12 15 6"/>',
  fwd:'<polyline points="9 18 15 12 9 6"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  home:'<path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M16 4a4 4 0 0 1 0 8"/><path d="M22 21v-1a6 6 0 0 0-4-5.6"/>',
  live:'<circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4"/><path d="M19.1 4.9a10 10 0 0 1 0 14.2"/><path d="M4.9 19.1a10 10 0 0 1 0-14.2"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22 6 12 13 2 6"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  keys:'<rect x="2" y="6" width="20" height="12" rx="2"/><line x1="7" y1="14" x2="17" y2="14"/><line x1="6" y1="10" x2="6.01" y2="10"/><line x1="10" y1="10" x2="10.01" y2="10"/><line x1="14" y1="10" x2="14.01" y2="10"/><line x1="18" y1="10" x2="18.01" y2="10"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8z"/>',
  speaker:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 7v6"/><path d="M12 17h.01"/>'
};
const ic = (n, color='#1C2B4F', size=22, w=2) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

const S = {
  screen:'home', who:'maa', method:'email', wheel:true, share:true,
  filter:'all', requested:{}, callBooked:false,
  lang:'en', step:2, help:false, xl:false
};
const SCREENS = [
  ['home','1 · Family home','f'],['add','2 · Add a trip','f'],['matches','3 · Find a companion','f'],
  ['profile','4 · Companion profile','f'],['live','5 · Travel day','f'],
  ['parent','6 · Parent home','p'],['journey','7 · Journey guide','p']
];
function go(s){ S.screen = s; S.help = false; render(); document.querySelector('#phone .scroll')?.scrollTo(0,0); }
function set(p){ Object.assign(S,p); render(); }

const backBtn = (to,label='Back') => `<button class="back" aria-label="${label}" onclick="go('${to}')">${ic('back','#1C2B4F',22,2.5)}</button>`;
function tabs(active){
  const t=[['home','Home','home'],['add','Trips','cal'],['matches','Companions','users'],['live','Live','live']];
  return `<nav class="tabs" aria-label="Main">${t.map(([s,l,i])=>`<button class="${active===s?'on':''}" ${active===s?'aria-current="page"':''} onclick="go('${s}')">${ic(i,active===s?'#1C2B4F':'#5A6172',24)}${l}</button>`).join('')}</nav>`;
}

const V = {};
V.home = () => `
<div class="scroll">
  <div class="row between">
    <div class="row"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="13" cy="17" r="10" fill="#1C2B4F"/><circle cx="21" cy="17" r="10" fill="#F4A62A" fill-opacity=".92"/></svg><span style="font-size:24px;font-weight:700;color:var(--navy)">Saathi</span></div>
    <button class="back" aria-label="Notifications">${ic('bell')}</button>
  </div>
  <div><div class="muted" style="font-size:15px">Saturday, 24 October</div><h2 style="margin:4px 0 0;font-size:30px">Hello, Anjali</h2></div>
  <div class="card">
    <div class="row between"><span class="label">Maa's next trip</span><span class="chip teal">${ic('check','#0E6E66',16,3)}Companion found</span></div>
    <div class="row between">
      <div><div style="font-size:36px;font-weight:700;color:var(--navy)">DEL</div><div class="muted" style="font-size:15px">Delhi · 02:10</div></div>
      <div class="row" style="flex:1;padding:0 12px;gap:6px"><div style="flex:1;border-top:2px dashed #C9CDD6"></div>${ic('plane','#F4A62A',24)}<div style="flex:1;border-top:2px dashed #C9CDD6"></div></div>
      <div style="text-align:right"><div style="font-size:36px;font-weight:700;color:var(--navy)">JFK</div><div class="muted" style="font-size:15px">New York · 07:45</div></div>
    </div>
    <div style="font-size:15px">Thu, 14 Nov · Air India AI 101 · Seat 32C</div>
    <div style="border-top:1px solid var(--line)"></div>
    <div class="row" style="gap:12px">
      <div class="avatar" style="width:48px;height:48px;background:var(--marigold-soft)">MJ</div>
      <div style="flex:1"><div style="font-size:17px;font-weight:700">Meera Joshi, 66</div><div class="muted" style="font-size:14px">Pune · Hindi, Marathi · Seat 34A</div></div>
      <button onclick="go('profile')" style="background:none;border:0;color:var(--navy);font-weight:700;font-size:15px;padding:10px 4px">View</button>
    </div>
    <button class="btn primary" onclick="go('live')">Follow travel day</button>
  </div>
  <div class="card" style="gap:10px">
    <div class="row between"><span class="label">Papa's trip</span><span class="chip gold">Not booked yet</span></div>
    <div style="font-size:17px;line-height:1.4">Add his flight when it is booked and we'll start looking for company.</div>
  </div>
  <button onclick="go('add')" class="row" style="gap:14px;padding:18px 20px;border:2px dashed #C9CDD6;border-radius:22px;background:transparent;text-align:left">
    <span class="avatar" style="width:48px;height:48px;background:var(--marigold)">${ic('plus','#1C2B4F',24,2.5)}</span>
    <span><span style="display:block;font-size:18px;font-weight:700;color:var(--navy)">Add a trip</span><span class="muted" style="font-size:15px">Forward the booking email. We do the rest.</span></span>
  </button>
</div>${tabs('home')}`;

V.add = () => {
  const hints = {
    email:'Forward the airline confirmation to trips@saathi.travel. We read the flight details in seconds.',
    upload:'Add the e-ticket PDF or a screenshot of the booking. A photo of a printout works too.',
    type:'Enter the flight number and date. We fill in the times, terminal and route.'
  };
  const tile=(m,i,l)=>`<button class="tile ${S.method===m?'on':''}" aria-pressed="${S.method===m}" onclick="set({method:'${m}'})">${ic(i,'#1C2B4F',26)}${l}</button>`;
  const sw=(k,t,d)=>`<button class="switch" role="switch" aria-checked="${S[k]}" onclick="set({${k}:${!S[k]}})"><span style="flex:1"><span style="display:block;font-size:16px;font-weight:700">${t}</span><span class="muted" style="font-size:14px">${d}</span></span><span class="track"></span></button>`;
  const f=(a,b)=>`<div class="field"><span>${a}</span><span>${b}</span></div>`;
  return `
<div class="scroll">
  <div class="row">${backBtn('home','Back to home')}<h2 class="title">Add a trip</h2></div>
  <div style="display:flex;flex-direction:column;gap:10px"><span class="label">Who is travelling?</span>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="pill ${S.who==='maa'?'on':''}" onclick="set({who:'maa'})">Maa (Sushila)</button>
      <button class="pill ${S.who==='papa'?'on':''}" onclick="set({who:'papa'})">Papa (Mahesh)</button>
      <button class="pill" style="border-style:dashed;color:var(--muted)">+ Add</button>
    </div></div>
  <div style="display:flex;flex-direction:column;gap:10px"><span class="label">How do you want to add the flight?</span>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${tile('email','mail','Forward email')}${tile('upload','upload','Ticket photo')}${tile('type','keys','Type it in')}</div>
    <div style="font-size:15px;line-height:1.45;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px">${hints[S.method]}</div></div>
  <div class="card">
    <div class="row" style="gap:8px">${ic('check','#0E6E66',18,2.5)}<span style="font-size:14px;font-weight:700;color:var(--teal)">Found in your email · just now</span></div>
    <div class="grid2" style="gap:14px 12px">${f('Passenger','Sushila Sharma')}${f('Flight','Air India AI 101')}${f('Date','Thu, 14 Nov 2026')}${f('Seat','32C')}${f('From','Delhi T3 · 02:10')}${f('To','New York JFK · 07:45')}</div>
    <div style="border-top:1px solid var(--line)"></div>
    ${sw('wheel','Wheelchair booked with Air India',"We'll remind you to confirm it 48 hours before.")}
    ${sw('share','Look for companions','Others see only the flight and date. Names stay private until both families agree.')}
  </div>
  <button class="btn primary" style="min-height:56px;font-size:18px" onclick="go('matches')">Save and find companions</button>
</div>${tabs('add')}`;
};

const PEOPLE = [
  {id:'meera',ini:'MJ',bg:'#FDF0D9',name:'Meera Joshi, 66',meta:'Pune → visiting her daughter in Edison, NJ',langs:'Hindi · Marathi · English',rel:'Same flight · Seat 34A',near:false,tags:['hindi','senior'],badges:['ID verified','Community vouched'],note:'Vegetarian. Has flown this route six times and knows JFK well.'},
  {id:'gupta',ini:'RG',bg:'#E4E9F5',name:'Ramesh & Usha Gupta, 71 & 67',meta:'Jaipur → visiting their son in Queens',langs:'Hindi · English',rel:'Same flight · Seats 41D–E',near:false,tags:['hindi','senior'],badges:['ID verified'],note:'Travelling as a couple. Happy to have one more in the group.'},
  {id:'arjun',ini:'AM',bg:'#E3F2EF',name:'Arjun Mehta, 27',meta:'Delhi → graduate student in New York',langs:'Hindi · Punjabi · English',rel:'Same flight · Seat 30B',near:false,tags:['hindi','helper'],badges:['ID verified','Student verified'],note:'Offers help with bags, the arrival form and finding the exit.'},
  {id:'lakshmi',ini:'LR',bg:'#F3E8F6',name:'Lakshmi Raman, 69',meta:'Chennai → visiting family in New Jersey',langs:'Tamil · English',rel:'Lands at JFK 40 min apart',near:true,tags:['senior'],badges:['ID verified'],note:'Different flight, same arrival hall. Can meet at immigration.'}
];
V.matches = () => {
  const list = PEOPLE.filter(p=>S.filter==='all'||p.tags.includes(S.filter));
  const fl=[['all','Everyone'],['hindi','Speaks Hindi'],['senior','Fellow seniors'],['helper','Young helpers']];
  return `
<div class="scroll" style="gap:16px">
  <div class="row">${backBtn('add')}<h2 class="title">Companions for Maa</h2></div>
  <div class="row" style="gap:12px;background:var(--navy);color:#fff;border-radius:18px;padding:14px 16px">${ic('plane','#F4A62A',24)}
    <span><span style="display:block;font-size:17px;font-weight:700">AI 101 · Delhi → New York</span><span style="font-size:14px;color:#C9D2E6">Thu, 14 Nov · ${list.length} traveller${list.length===1?'':'s'} around this flight</span></span></div>
  <div role="group" aria-label="Filter companions" class="row" style="gap:8px;overflow-x:auto;padding-bottom:2px">${fl.map(([k,l])=>`<button class="pill ${S.filter===k?'on':''}" aria-pressed="${S.filter===k}" onclick="set({filter:'${k}'})">${l}</button>`).join('')}</div>
  ${list.map(p=>`
  <div class="card" style="padding:18px;gap:12px">
    <div class="row" style="gap:12px;align-items:flex-start">
      <div class="avatar" style="width:56px;height:56px;background:${p.bg};font-size:18px">${p.ini}</div>
      <div style="flex:1;min-width:0"><button onclick="go('profile')" style="background:none;border:0;padding:0;font-size:18px;font-weight:700;color:var(--ink);text-align:left">${p.name}</button>
        <div class="muted" style="font-size:14px">${p.meta}</div><div style="font-size:14px">${p.langs}</div></div>
    </div>
    <div class="row" style="gap:6px;flex-wrap:wrap"><span class="chip ${p.near?'grey':'gold'}" style="font-size:13px;padding:5px 10px">${p.rel}</span>${p.badges.map(b=>`<span class="chip teal" style="font-size:13px;padding:5px 10px">${ic('shield','#0E6E66',14,2.5)}${b}</span>`).join('')}</div>
    <div style="font-size:15px;line-height:1.4">${p.note}</div>
    ${S.requested[p.id]
      ? `<div class="btn ok" style="min-height:48px;font-size:16px">${ic('check','#0E6E66',18,3)}Request sent to their family</div>`
      : `<button class="btn gold" style="min-height:48px;font-size:16px" onclick="S.requested['${p.id}']=true;render()">Request an introduction</button>`}
  </div>`).join('')}
  <div class="muted" style="font-size:14px;line-height:1.45;text-align:center;padding:0 8px">Families are introduced first. Phone numbers are shared only when both sides say yes.</div>
</div>${tabs('matches')}`;
};

V.profile = () => {
  const trust = t => `<div class="row">${ic('shield','#0E6E66',22)}<span style="font-size:16px">${t}</span></div>`;
  const box = (a,b) => `<div class="card" style="padding:14px;gap:4px;border-radius:18px"><span class="muted" style="font-size:13px">${a}</span><span style="font-size:16px;font-weight:700">${b}</span></div>`;
  return `
<div class="scroll">
  ${backBtn('matches','Back to companions')}
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
    <div class="avatar" style="width:104px;height:104px;background:var(--marigold-soft);border:4px solid var(--marigold);font-size:36px">MJ</div>
    <h2 style="margin:4px 0 0;font-size:28px">Meera Joshi</h2>
    <div class="muted" style="font-size:16px">66 · Pune · Visiting her daughter in Edison, NJ</div>
    <span class="chip gold">${ic('plane','#7A4A00',16)}Same flight · AI 101 · Seat 34A</span>
  </div>
  <div class="card" style="padding:18px;gap:12px"><span class="label">Why you can trust this match</span>${trust('Government ID checked')}${trust('Vouched for by her community association')}${trust('Family contact: Neha Joshi (daughter)')}</div>
  <div class="grid2">${box('Speaks','Hindi, Marathi, English')}${box('Food','Vegetarian')}${box('Seat','34A, two rows behind Maa')}${box('Mobility','Walks comfortably')}</div>
  ${S.callBooked
    ? `<div class="btn ok" style="flex-direction:column;gap:2px;padding:10px"><span>Call requested for Sun, 10 Nov</span><span style="font-size:14px;font-weight:400">Neha will confirm a time. Maa can join too.</span></div>`
    : `<button class="btn primary" style="min-height:56px" onclick="set({callBooked:true})">${ic('video','#fff')}Set up a family video call</button>`}
  <button class="btn outline">Message Neha</button>
  <div class="muted" style="font-size:14px;line-height:1.45">Saathi companions offer company, not medical care. Book wheelchair or meet-and-assist services with the airline.</div>
</div>`;
};

V.live = () => {
  const ev=[['Lands at JFK, Terminal 4','07:40 New York time · expected','next'],['Took off from Delhi','02:24 India time','now'],['Boarded together with Meera ji','01:48','done'],['Met Meera ji at gate 12','00:55','done'],['Cleared security','23:40','done'],['Checked in, wheelchair confirmed','22:15','done']];
  return `
<div class="scroll">
  <div class="row">${backBtn('home','Back to home')}<h2 class="title" style="flex:1">Travel day</h2><span class="chip" style="background:#FDECEA;color:#A3261B"><span style="width:8px;height:8px;border-radius:4px;background:#C8341F"></span>Live</span></div>
  <div style="background:var(--navy);color:#fff;border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:16px">
    <div><div style="font-size:15px;color:#C9D2E6">AI 101 · Thu, 14 Nov</div><div style="font-size:28px;font-weight:700;line-height:1.15">Maa is in the air, with Meera ji</div></div>
    <div><div style="height:10px;border-radius:5px;background:#33446E"><div style="width:38%;height:10px;border-radius:5px;background:var(--marigold)"></div></div>
      <div class="row between" style="font-size:15px;margin-top:8px"><span><b>DEL</b> left 02:24</span><span><b>JFK</b> lands 07:40</span></div></div>
    <div style="font-size:15px;color:#C9D2E6">On time · About 9 hours to go</div>
  </div>
  <div class="card" style="padding:18px;gap:4px"><span class="label" style="padding-bottom:8px">Updates</span>
    ${ev.map(([t,tm,st],i)=>`<div class="tl"><div class="rail"><span class="dot ${st==='done'?'':st}"></span>${i<ev.length-1?'<span class="line"></span>':''}</div><div style="flex:1;padding-bottom:14px"><div style="font-size:16px;${st==='next'?'color:var(--muted)':'font-weight:700'}">${t}</div><div class="muted" style="font-size:14px">${tm}</div></div></div>`).join('')}
  </div>
  <div class="row" style="background:var(--marigold-soft);border-radius:18px;padding:16px;gap:12px;align-items:flex-start">${ic('clock','#7A4A00')}<span style="font-size:16px;line-height:1.4;color:#4A2E00">Be at Terminal 4 arrivals by <b>08:30</b>. We'll message you on WhatsApp when she clears immigration.</span></div>
  <div class="grid2"><button class="btn primary">${ic('phone','#fff',20)}Call Maa</button><button class="btn outline">Call Meera ji</button></div>
  <button onclick="go('parent')" style="background:none;border:0;color:var(--navy);font-weight:700;font-size:15px;padding:8px">See what Maa sees on her phone</button>
</div>${tabs('live')}`;
};

const T = {
  en:{listen:'Read aloud',hello:'Namaste, Sushila ji',notAlone:'You are not travelling alone.',yourFlight:'Your flight',date:'Thursday, 14 November',route:'Delhi → New York',leave:'Leave home by 9:30 pm on Wednesday',yourSaathi:'Your Saathi',meera:'Meera Joshi',meeraNote:'From Pune. Speaks Hindi. Sits near you, seat 34A.',callMeera:'Call Meera ji',callAnjali:'Call Anjali',start:'Start my journey',voice:'en-IN',
    back:'Back',now:'Do this now',done:'Done, next step',later:'Coming up',restart:'Start again',needHelp:'I need help',helpTitle:'Help is on the way',helpBody:'Meera ji and Anjali have been told where you are. Stay where you are.',ok:'OK',of:(a,b)=>`Step ${a} of ${b}`,
    steps:[['Check in','Air India counter, Terminal 3. Show your passport. Ask for the wheelchair.'],['Security check','Keep your passport and boarding pass in your hand. Phone and coins go in the tray.'],['Go to gate 12','Boarding starts at 1:30 am. Meera ji is waiting at the gate in a blue shawl.'],['On the plane','Your seat is 32C. Meera ji is in 34A, two rows behind you. Tap help any time.'],['New York: immigration','Show your passport and visa. Say: "I am visiting my daughter." Meera ji will stay with you.'],['Bags, then Anjali','Collect your bags at the belt. Anjali is waiting outside, Terminal 4 arrivals.']]},
  hi:{listen:'सुनें',hello:'नमस्ते, सुशीला जी',notAlone:'आप अकेली यात्रा नहीं कर रहीं।',yourFlight:'आपकी उड़ान',date:'गुरुवार, 14 नवंबर',route:'दिल्ली → न्यूयॉर्क',leave:'बुधवार रात 9:30 बजे तक घर से निकलें',yourSaathi:'आपकी साथी',meera:'मीरा जोशी',meeraNote:'पुणे से। हिंदी बोलती हैं। आपके पास बैठेंगी, सीट 34A।',callMeera:'मीरा जी को कॉल करें',callAnjali:'अंजलि को कॉल करें',start:'मेरी यात्रा शुरू करें',voice:'hi-IN',
    back:'वापस',now:'अभी यह करें',done:'हो गया, अगला कदम',later:'आगे',restart:'फिर से शुरू करें',needHelp:'मुझे मदद चाहिए',helpTitle:'मदद आ रही है',helpBody:'मीरा जी और अंजलि को बता दिया गया है कि आप कहाँ हैं। वहीं रहें।',ok:'ठीक है',of:(a,b)=>`कदम ${a} / ${b}`,
    steps:[['चेक-इन','एयर इंडिया काउंटर, टर्मिनल 3. पासपोर्ट दिखाएँ। व्हीलचेयर माँगें।'],['सुरक्षा जाँच','पासपोर्ट और बोर्डिंग पास हाथ में रखें। फ़ोन और सिक्के ट्रे में रखें।'],['गेट 12 पर जाएँ','बोर्डिंग रात 1:30 बजे शुरू होगी। मीरा जी नीली शॉल में गेट पर इंतज़ार कर रही हैं।'],['विमान में','आपकी सीट 32C है। मीरा जी 34A में हैं, दो पंक्ति पीछे। कभी भी मदद दबाएँ।'],['न्यूयॉर्क: इमिग्रेशन','पासपोर्ट और वीज़ा दिखाएँ। कहें: "I am visiting my daughter." मीरा जी आपके साथ रहेंगी।'],['सामान, फिर अंजलि','बेल्ट से अपना सामान लें। अंजलि टर्मिनल 4 के बाहर इंतज़ार कर रही है।']]}
};
const langSeg = () => `<div class="seg" role="group" aria-label="Language"><button class="${S.lang==='en'?'on':''}" aria-pressed="${S.lang==='en'}" onclick="set({lang:'en'})">English</button><button class="${S.lang==='hi'?'on':''}" aria-pressed="${S.lang==='hi'}" onclick="set({lang:'hi'})">हिंदी</button></div>`;
function speak(){
  const t=T[S.lang];
  try{ const s=window.speechSynthesis; if(!s) return; s.cancel();
    const u=new SpeechSynthesisUtterance([t.hello,t.notAlone,t.yourFlight,t.date,t.route,t.yourSaathi,t.meera,t.meeraNote].join('. '));
    u.lang=t.voice; u.rate=.9; s.speak(u);}catch(e){}
}
V.parent = () => { const t=T[S.lang]; return `
<div class="scroll" lang="${S.lang}">
  <div class="row between">${langSeg()}<button onclick="speak()" class="row" style="height:52px;padding:0 16px;border-radius:999px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:17px;font-weight:700;gap:8px">${ic('speaker')}${t.listen}</button></div>
  <div><h2 class="sz-h1" style="margin:0;font-size:34px;line-height:1.2;color:var(--navy)">${t.hello}</h2><div class="sz-body" style="font-size:21px;line-height:1.4;color:#3E4553;margin-top:6px">${t.notAlone}</div></div>
  <div style="background:var(--ground);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px">
    <span class="sz-label" style="font-size:17px;font-weight:700;color:var(--muted)">${t.yourFlight}</span>
    <span class="sz-h2" style="font-size:26px;font-weight:700">${t.date}</span>
    <span class="sz-h2" style="font-size:26px;font-weight:700;color:var(--navy)">${t.route}</span>
    <span class="sz-body" style="font-size:21px;color:#3E4553">${t.leave}</span>
  </div>
  <div class="row" style="background:var(--marigold-soft);border-radius:24px;padding:20px;gap:16px">
    <div class="avatar" style="width:80px;height:80px;background:#fff;border:4px solid var(--marigold);font-size:28px">MJ</div>
    <div><div class="sz-label" style="font-size:17px;font-weight:700;color:var(--brown)">${t.yourSaathi}</div><div class="sz-h2" style="font-size:26px;font-weight:700">${t.meera}</div><div class="sz-label" style="font-size:17px;line-height:1.35;color:#4A2E00">${t.meeraNote}</div></div>
  </div>
  <button class="btn gold big sz-btn">${ic('phone','#1C2B4F',26,2.2)}${t.callMeera}</button>
  <button class="btn primary big sz-btn">${ic('phone','#fff',26,2.2)}${t.callAnjali}</button>
  <button class="btn outline big sz-btn" style="border-width:2.5px" onclick="go('journey')">${t.start}${ic('fwd','#1C2B4F',24,2.5)}</button>
</div>`; };

V.journey = () => { const t=T[S.lang], st=t.steps, last=st.length-1, cur=st[S.step]; return `
<div class="scroll" lang="${S.lang}" style="gap:14px;padding-bottom:16px">
  <div class="row between"><button class="back" style="width:52px;height:52px;border-radius:26px;background:#F0F1F4;border:0" aria-label="${t.back}" onclick="go('parent')">${ic('back','#1C2B4F',26,2.5)}</button>${langSeg()}</div>
  <div><div class="sz-label" style="font-size:17px;font-weight:700;color:var(--muted);margin-bottom:8px">${t.of(S.step+1,st.length)}</div>
    <div class="bars">${st.map((_,i)=>`<span class="${i<S.step?'done':i===S.step?'now':''}"></span>`).join('')}</div></div>
  ${S.help?`<div role="status" style="background:var(--teal-soft);border:2px solid var(--teal);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px">
    <span class="sz-h2" style="font-size:23px;font-weight:700;color:var(--teal)">${t.helpTitle}</span><span class="sz-body" style="font-size:20px;line-height:1.4;color:#0B4F49">${t.helpBody}</span>
    <button onclick="set({help:false})" style="align-self:flex-start;height:48px;padding:0 18px;border-radius:999px;border:2px solid var(--teal);background:#fff;color:var(--teal);font-size:17px;font-weight:700">${t.ok}</button></div>`:''}
  <div style="background:var(--marigold-soft);border:3px solid var(--marigold);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px">
    <span class="sz-label" style="font-size:17px;font-weight:700;color:var(--brown)">${t.now}</span>
    <span class="sz-h1" style="font-size:30px;font-weight:700;line-height:1.15;color:var(--navy)">${cur[0]}</span>
    <span class="sz-body" style="font-size:20px;line-height:1.4;color:#2B2F38">${cur[1]}</span>
    ${S.step<last?`<button class="btn primary sz-btn" style="min-height:64px;font-size:21px;margin-top:6px" onclick="set({step:${S.step+1},help:false})">${ic('check','#fff',26,3)}${t.done}</button>`
      :`<button class="btn outline" style="min-height:56px;font-size:18px;border-width:2px;margin-top:6px" onclick="set({step:0,help:false})">${t.restart}</button>`}
  </div>
  ${S.step<last?`<div style="display:flex;flex-direction:column;gap:8px"><span class="sz-label" style="font-size:17px;font-weight:700;color:var(--muted)">${t.later}</span>
    ${st.slice(S.step+1).map((s,i)=>`<div class="row" style="gap:12px;padding:12px 14px;border-radius:16px;background:var(--ground)"><span class="avatar" style="width:32px;height:32px;background:#fff;border:2px solid #C9CDD6;color:#3E4553;font-size:16px">${S.step+i+2}</span><span class="sz-body" style="font-size:18px;color:#2B2F38">${s[0]}</span></div>`).join('')}</div>`:''}
</div>
<div style="padding:12px 20px 22px;border-top:1px solid var(--line);background:#fff">
  <button class="btn sz-btn" style="width:100%;min-height:72px;border-radius:22px;background:var(--red);color:#fff;font-size:23px" onclick="set({help:true})">${ic('alert','#fff',28,2.2)}${t.needHelp}</button>
</div>`; };

function render(){
  const ph=document.getElementById('phone');
  ph.className='phone'+(['parent','journey'].includes(S.screen)?' white':'')+(S.xl?' xl':'');
  ph.innerHTML=V[S.screen]();
  const mk=g=>SCREENS.filter(s=>s[2]===g).map(([id,l])=>`<button class="jump ${S.screen===id?'on':''}" onclick="go('${id}')">${l}</button>`).join('');
  document.getElementById('jumpsFamily').innerHTML=mk('f');
  document.getElementById('jumpsParent').innerHTML=mk('p');
  document.getElementById('szL').className=S.xl?'':'on';
  document.getElementById('szXL').className=S.xl?'on':'';
}
document.getElementById('szL').onclick=()=>set({xl:false});
document.getElementById('szXL').onclick=()=>set({xl:true});
render();
</script>
</body>
</html>
